<!doctype html>
<html lang="en" dir="ltr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex, nofollow">
  <title>Portfolio Admin</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22%3E%3Ccircle cx=%2250%22 cy=%2250%22 r=%2250%22 fill=%22%230f766e%22/%3E%3Ctext x=%2250%22 y=%2268%22 font-size=%2252%22 text-anchor=%22middle%22 fill=%22white%22 font-family=%22Arial%22 font-weight=%22bold%22%3EA%3C/text%3E%3C/svg%3E">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="assets/css/style.css?v=6">
  <link rel="stylesheet" href="assets/css/admin.css?v=6">
</head>
<body class="admin">

  <!-- Login -->
  <div class="login-wrap" id="loginView">
    <form class="login-card" id="loginForm" autocomplete="off">
      <h1>Portfolio Admin</h1>
      <p>Paste your GitHub access token to edit the site. Saved changes go live in about a minute.</p>
      <div class="field">
        <label for="tokenInput">GitHub token</label>
        <input type="password" id="tokenInput" placeholder="github_pat_…" required>
      </div>
      <details>
        <summary>Repository settings</summary>
        <div class="row-3">
          <div class="field"><label for="ownerInput">Owner</label><input type="text" id="ownerInput"></div>
          <div class="field"><label for="repoInput">Repository</label><input type="text" id="repoInput"></div>
          <div class="field"><label for="branchInput">Branch</label><input type="text" id="branchInput"></div>
        </div>
      </details>
      <div class="login-error" id="loginError" role="alert"></div>
      <button class="btn btn-primary" type="submit" id="loginBtn" style="justify-content:center">Sign in</button>
      <p>No token? <button class="link-btn" type="button" id="offlineBtn">Edit without saving</button> (you can download the result as data.json).</p>
      <p><a href="index.html">← Back to portfolio</a></p>
    </form>
  </div>

  <!-- Editor -->
  <div id="editorView" hidden>
    <header class="admin-bar">
      <div class="inner">
        <h1><span class="dirty-dot" title="Unsaved changes"></span>Portfolio Admin</h1>
        <button class="btn btn-sm" type="button" id="previewLangBtn" title="Preview language">عربي</button>
        <button class="btn btn-sm" type="button" id="togglePreviewBtn">Hide preview</button>
        <button class="btn btn-sm" type="button" id="cvBtn">Preview CV</button>
        <button class="btn btn-sm" type="button" id="exportBtn">Export</button>
        <label class="btn btn-sm" for="importInput">Import<input type="file" id="importInput" accept="application/json,.json" hidden></label>
        <a class="btn btn-sm" href="index.html" target="_blank" rel="noopener">View site</a>
        <button class="btn btn-sm btn-danger" type="button" id="logoutBtn">Log out</button>
        <button class="btn btn-sm btn-primary" type="button" id="saveBtn">Save</button>
      </div>
    </header>
    <div class="admin-layout">
      <div id="editor"></div>
      <div class="preview-pane"><iframe id="preview" title="Live preview"></iframe></div>
    </div>
  </div>

  <input type="file" id="photoInput" accept="image/*" hidden>
  <input type="file" id="casePhotoInput" accept="image/*" multiple hidden>
  <div class="toast" id="toast" role="status"></div>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
  <script src="assets/js/i18n.js?v=6"></script>
  <script src="assets/js/icons.js?v=6"></script>
  <script src="assets/js/cv.js?v=6"></script>
  <script src="assets/js/admin.js?v=6"></script>
</body>
</html>
